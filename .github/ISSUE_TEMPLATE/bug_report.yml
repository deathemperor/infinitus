name: Bug report
description: Report broken behavior, regressions, crashes, or reliability issues.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        Feature requests belong in [Discussions](https://github.com/deathemperor/infinitus/discussions/categories/ideas).
        Search existing issues first and keep the report focused on one problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included enough detail to reproduce or investigate the problem.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Mac app (menu bar popup, pop-out, wall, settings)
        - Phone app (iOS, widgets, share sheet)
        - infinitusctl / InfinitusCLI
        - Engines (cswap, CLIProxyAPI, other adapters)
        - Sessions, resume nudge, transcripts
        - Team publishing
        - Build, CI, or release tooling (make-app.sh, Homebrew, nightly)
        - Site or docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Open the popup with ...
        2. Switch to account ...
        3. Run `infinitusctl ...`
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The popup should show the new account within a second.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The popup keeps the old account and the gauge stops updating.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, nightly date, commit SHA, or branch name if known.
      placeholder: main @ abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS / iOS version, install method (brew, nightly, built from source), engine and version if relevant.
      placeholder: macOS 26.0, brew infinitus@nightly, cswap 0.9.1

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste the most relevant output only (`infinitusctl perf`, Console.app, crash report). Redact keys and tokens.
      render: shell

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, recordings, or supporting files
      description: Upload screenshots, short recordings, or log files. Redact secrets before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip"

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
      placeholder: Relaunching the app clears the stuck state.
