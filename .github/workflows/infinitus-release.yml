# The one Infinitus release (#823 layer 3): a `v<version>` tag builds the
# menu bar app (apps/mac, both bundles), nests the Menu Bar build in the
# desktop DMG from the same sha, builds the Linux tray, and publishes all of
# it as one GitHub release. The version is the root VERSION file; the tag
# must match it. Upstream's release.yml (npm, AUR, web, marketing) stays
# disabled and untouched, hence this file's name. infinitus-nightly.yml
# calls the same build jobs every night with a dated version and publishes
# the rolling `nightly` prerelease itself (#1042); `publish` here runs on a
# tag only.
name: Infinitus release
on:
  push:
    tags: ["v*"]
  # Dispatch is the dry run: every job builds and uploads its artifacts,
  # nothing is published.
  workflow_dispatch:
  # infinitus-nightly.yml: the build jobs with its version in place of
  # VERSION's; the caller's ref is not a tag, so `publish` stays skipped.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
# The build jobs only upload artifacts (the runtime token, no scope needed);
# `publish` alone talks to the repo (`gh release create`) and holds
# `contents: write` itself (#1065). As a
# workflow_call callee this is also the ceiling the nightly caller's build
# jobs get.
permissions:
  contents: read

jobs:
  # Release notes have to exist BEFORE anything is signed. `publish` reads
  # the `## <version>` section out of apps/mac/CHANGELOG.md and refuses a
  # tag without one, but it runs last, so a cut that skipped the fold used
  # to fail only after a full sign-and-notarize run. This is the same check
  # in seconds. It also fails on a leftover fragment, the signature of a
  # hand-tag that never ran fold-changelog.mjs: the script unlinks what it
  # folds, so a proper cut commit carries the deletions and this sees an
  # empty changelog.d.
  #
  # The job itself always runs and only its STEPS are tag-gated (ci.yml's
  # mac_changes idiom): a skipped job skips everything that `needs:` it,
  # which would strand the dispatch dry run and the nightly's workflow_call
  # with nothing built.
  notes:
    name: Check release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Release notes and fragments
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # VERSION, not the tag: the mac job enforces that they match, and
          # this is the file the fold was run against.
          version="$(head -1 VERSION | tr -cd '0-9A-Za-z.-')"
          if [[ -d apps/mac/changelog.d ]]; then
            left="$(find apps/mac/changelog.d -type f ! -name README.md | sort)"
            if [[ -n "$left" ]]; then
              echo "Unfolded release-note fragments at $GITHUB_REF_NAME:" >&2
              printf '%s\n' "$left" >&2
              echo "Run 'node scripts/fold-changelog.mjs $version' and commit the deletions it makes." >&2
              exit 1
            fi
          fi
          awk -v v="$version" '
            $0 == "## " v { grab = 1; next }
            grab && /^## /  { exit }
            grab            { print }
          ' apps/mac/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "apps/mac/CHANGELOG.md has no '## $version' section; a release ships with notes." >&2
            exit 1
          fi
          { echo "Release notes for $version:"; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

  # Fork (#1322): the T3 Connect public values baked into every build —
  # the desktop, the CLI archive and, by hand, the phone. Upstream's
  # `relay_public_config` fails the release when the `production`
  # environment is not filled in; here an empty environment is a release
  # without T3 Connect, exactly the release cut before the relay existed,
  # so each value is passed through as it is (empty included) and the
  # build scripts read an empty string as "disabled". The step summary
  # says which it was. Values only, never a secret.
  connect:
    name: Resolve T3 Connect public config
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
    env:
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - id: config
        shell: bash
        run: |
          set -euo pipefail
          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          relay_url=""
          if [[ -n "$relay_domain" ]]; then
            relay_url="https://$relay_domain"
          fi
          {
            echo "clerk_publishable_key=${CLERK_PUBLISHABLE_KEY:-}"
            echo "clerk_jwt_template=${CLERK_JWT_TEMPLATE:-}"
            echo "clerk_cli_oauth_client_id=${CLERK_CLI_OAUTH_CLIENT_ID:-}"
            echo "relay_url=$relay_url"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$relay_url" && -n "${CLERK_PUBLISHABLE_KEY:-}" && -n "${CLERK_JWT_TEMPLATE:-}" && -n "${CLERK_CLI_OAUTH_CLIENT_ID:-}" ]]; then
            echo "T3 Connect: builds point at $relay_url." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "T3 Connect: off (the production environment carries no relay config)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Swift app on the macOS 26 image (the glass chrome needs its SDK):
  # `Infinitus-Menu-Bar-<v>.zip` (CFBundleName "Infinitus Menu Bar", no
  # infinitus:// URL type), which the desktop job nests as a login item.
  # Signed, notarized and stapled here so the nested copy carries its own
  # ticket into the desktop bundle (#777). The standalone `Infinitus-<v>.zip`
  # and its Homebrew cask left with #1238: the menu bar app ships only
  # inside the desktop app.
  mac:
    name: Build menu bar app
    needs: notes
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mac
    env:
      # secrets can't be referenced in `if:` directly; job env is the
      # documented bridge (step-local env is invisible to its own `if`).
      # Only a derived boolean rides job-wide — the raw secret stays
      # step-local to the import step.
      HAS_DEVID: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release version
        id: version
        working-directory: .
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A nightly's dated version replaces VERSION here, so make-app.sh
          # stamps it and the desktop job's helper check sees the same string.
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            printf '%s\n' "$INPUT_VERSION" > VERSION
          fi
          version="$(head -1 VERSION | tr -cd '0-9A-Za-z.-')"
          case "$GITHUB_REF" in
            refs/tags/*)
              if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
                echo "Tag $GITHUB_REF_NAME does not match VERSION ($version); bump VERSION in the release PR first." >&2
                exit 1
              fi;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Infinitus $version." >> "$GITHUB_STEP_SUMMARY"
      # Developer ID + notarization run only when the secrets exist
      # (docs/RELEASING.md); without them the build is ad-hoc signed as
      # before. Order matters: sign → notarize the app → staple the app →
      # THEN zip, because the staple lives on the .app, not the archive.
      - name: Import Developer ID certificate
        if: env.HAS_DEVID == 'true'
        env:
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" \
            -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      # The copy Infinitus desktop nests at Contents/Library/LoginItems —
      # named "Infinitus Menu Bar", no infinitus:// URL type (the desktop
      # owns the scheme). make-app.sh writes a fixed Infinitus.app, so it
      # is moved into out/ under its own name.
      - name: Build bundled account engine
        env:
          INFINITUS_ENGINE_BUILD_ROOT: ${{ runner.temp }}/infinitus-engine
        run: |
          ./build-swapd.sh
          echo "INFINITUS_BUNDLED_SWAPD=$INFINITUS_ENGINE_BUILD_ROOT/bin/swapd" >> "$GITHUB_ENV"
      - name: Build app bundle
        run: |
          mkdir out
          INFINITUS_BUNDLE_NAME="Infinitus Menu Bar" ./make-app.sh
          mv Infinitus.app "out/Infinitus Menu Bar.app"
      - name: Notarize and staple
        if: env.HAS_DEVID == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          APP="out/Infinitus Menu Bar.app"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple "$APP"
          spctl --assess --type execute -vv "$APP"
          rm notarize.zip
      - name: Zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent "out/Infinitus Menu Bar.app" "Infinitus-Menu-Bar-${VERSION}.zip"
          shasum -a 256 "Infinitus-Menu-Bar-${VERSION}.zip"
      # The ditto zip travels as the run artifact (symlinks and the staple
      # survive; the artifact wrapper is unpacked by the consumers).
      - uses: actions/upload-artifact@v4
        with:
          name: mac-bundles
          path: |
            apps/mac/Infinitus-*.zip
          if-no-files-found: error

  desktop:
    name: Build desktop macOS arm64
    needs: [notes, mac, connect]
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@infinitus/desktop... --filter=t3... --filter=@infinitus/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # The menu bar app rides inside the desktop bundle as a login item
      # (#777). It is never rebuilt here: the mac job of this same run
      # signed, notarized and stapled it, so the zip already carries a
      # helper that passes Gatekeeper on its own.
      - name: Download native helper
        uses: actions/download-artifact@v4
        with:
          name: mac-bundles
          path: ${{ runner.temp }}/native-helper

      - name: Unpack native helper
        id: native_helper
        shell: bash
        env:
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/native-helper"
          # The mac job uploads the nested build `Infinitus-Menu-Bar-<v>.zip`
          # ("Infinitus Menu Bar", no URL type).
          zip=$(ls "$dir"/Infinitus-Menu-Bar-*.zip)
          ditto -x -k "$zip" "$dir/unpacked"
          app=$(find "$dir/unpacked" -maxdepth 2 -name '*.app' -type d | head -n 1)
          if [[ -z "$app" || ! -f "$app/Contents/Info.plist" ]]; then
            echo "The mac job's artifact carries no app bundle." >&2
            exit 1
          fi
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [[ "$bundle_id" != "run.infinitus" ]]; then
            echo "The native app's bundle id is $bundle_id, not run.infinitus." >&2
            exit 1
          fi
          if [[ "$version" != "$VERSION" ]]; then
            echo "The menu bar app says $version, the release is $VERSION." >&2
            exit 1
          fi
          echo "path=$app" >> "$GITHUB_OUTPUT"
          echo "Nesting the menu bar app $version as the login item helper." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          set -euo pipefail
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      # The certificate and its password reach electron-builder through the
      # build step's own env; only the notary key needs a file on disk, and
      # `security cms` never sees it — notarytool reads the .p8 directly.
      - name: Prepare macOS signing
        id: signing
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12_BASE64" || -z "$DEVELOPER_ID_P12_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing disabled (no Developer ID certificate secret); building unsigned." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -z "$NOTARY_KEY_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "A Developer ID certificate is configured but the notary key secrets are not." >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "notary_key_path=$key_path" >> "$GITHUB_OUTPUT"

          # Import the certificate into a keychain of our own and hand
          # electron-builder that keychain (CSC_KEYCHAIN) instead of the p12
          # (CSC_LINK): electron-builder 26.15's own import creates the
          # keychain with a random password but then runs
          # `set-key-partition-list -k <p12 password>` against it, which fails
          # with "passphrase you entered is not correct" (run 34488667586).
          # Same sequence as the native branch's release workflow.
          keychain="$RUNNER_TEMP/fork-sign.keychain-db"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$p12_path"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$p12_path"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "The imported certificate carries no Developer ID Application identity." >&2
            exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "macOS signing enabled (Developer ID + notarytool)." >> "$GITHUB_STEP_SUMMARY"

      # A signed desktop can only nest a helper notarytool accepts: Developer
      # ID from the same team, hardened runtime, and its own stapled ticket
      # (the nested code keeps that ticket; the outer bundle gets its own).
      # Fail here, naming the tag, rather than in notarization.
      - name: Verify native helper signature
        if: ${{ steps.native_helper.outputs.path != '' && steps.signing.outputs.signed == 'true' }}
        shell: bash
        env:
          APP: ${{ steps.native_helper.outputs.path }}
          TAG: v${{ needs.mac.outputs.version }}
        run: |
          set -euo pipefail
          details=$(codesign -dv --verbose=2 "$APP" 2>&1)
          for want in "Authority=Developer ID Application" "TeamIdentifier=Q783W6B4FA" "flags=0x10000(runtime)"; do
            if ! grep -qF "$want" <<<"$details"; then
              echo "The native release $TAG is not signed for nesting (missing: $want); cut a Developer ID release first." >&2
              echo "$details" >&2
              exit 1
            fi
          done
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"

      - name: Build desktop artifact
        shell: bash
        env:
          # The updater feed is this repo, so the published release is the
          # one an installed build finds on its feed.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_APPLE_TEAM_ID: Q783W6B4FA
          CSC_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          APPLE_API_KEY: ${{ steps.signing.outputs.notary_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: Q783W6B4FA
          # Fork (#1322): T3 Connect's public values, empty when unset.
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.connect.outputs.clerk_publishable_key }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.connect.outputs.clerk_jwt_template }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.connect.outputs.clerk_cli_oauth_client_id }}
          T3CODE_RELAY_URL: ${{ needs.connect.outputs.relay_url }}
          T3CODE_DESKTOP_NATIVE_HELPER: ${{ steps.native_helper.outputs.path }}
          # Fork (#1322): a signed build that carries the Clerk key must also
          # carry an Associated Domains provisioning profile for
          # run.infinitus.desktop (passkeys), or the build script refuses.
          # Base64 of the .provisionprofile; absent = ship signed without
          # T3 Connect rather than fail the release.
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          args=(
            --platform mac
            --target dmg
            --arch arm64
            --build-version "${{ steps.version.outputs.version }}"
            --verbose
          )
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            args+=(--signed)
            if [[ -n "${T3CODE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
              if [[ -n "${MACOS_PROVISIONING_PROFILE:-}" ]]; then
                profile_path="$RUNNER_TEMP/infinitus.provisionprofile"
                printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
                security cms -D -i "$profile_path" >/dev/null
                export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
              else
                echo "Signed desktop without T3 Connect: MACOS_PROVISIONING_PROFILE is not set, so the Clerk key stays out of this build." >> "$GITHUB_STEP_SUMMARY"
                unset T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_CLERK_JWT_TEMPLATE T3CODE_CLERK_CLI_OAUTH_CLIENT_ID T3CODE_RELAY_URL
              fi
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          vp run dist:desktop:artifact "${args[@]}"

      # The helper must come out of packaging with its own seal intact and
      # its own entitlements, not Electron's: electron-builder's signIgnore
      # keeps the fork's signer off it, and this proves that held.
      - name: Verify nested helper
        if: ${{ steps.native_helper.outputs.path != '' }}
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          # The zip is what electron-updater installs, so verify that, not
          # the stage (the build script copies only files to release/).
          ditto -x -k release/Infinitus-*.zip "$RUNNER_TEMP/nested-check"
          app=$(find "$RUNNER_TEMP/nested-check" -maxdepth 1 -name '*.app' -type d | head -n 1)
          nested="$app/Contents/Library/LoginItems/Infinitus Menu Bar.app"
          if [[ ! -f "$nested/Contents/Info.plist" ]]; then
            echo "The packaged app carries no nested helper at $nested." >&2
            find "$app/Contents" -maxdepth 2 >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$nested"
          if codesign -d --entitlements :- "$nested" 2>/dev/null | grep -q "com.apple.security.cs.allow-jit"; then
            echo "The nested helper was re-signed with Electron's entitlements." >&2
            exit 1
          fi
          if [[ "$SIGNED" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
          fi

      - name: Remove the signing keychain
        if: ${{ always() && steps.signing.outputs.keychain != '' }}
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      # The DMG installs the app; the zip and the manifest are what
      # electron-updater downloads for an in-place update. The manifest is
      # named after the version's prerelease id (`alpha-mac.yml` for
      # `0.5.0-alpha.N`, `latest-mac.yml` for a plain version): that is the
      # name an installed build asks for (#924). One arch, so no per-arch
      # manifest renaming or merging.
      - name: Collect release assets
        shell: bash
        env:
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          # resolveDesktopPublishChannel's rule: the first prerelease id, or
          # `infinitus-nightly` for the nightly track's build (#1042).
          if [[ "$VERSION" == *-infinitus-nightly.* ]]; then
            channel=infinitus-nightly
          else
            channel="${VERSION#*-}"
            [[ "$channel" == "$VERSION" ]] && channel=latest || channel="${channel%%.*}"
          fi
          manifest="${channel}-mac.yml"

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.blockmap" \
            "release/$manifest"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ ! -f "release-publish/$manifest" ]]; then
            echo "electron-builder wrote no $manifest; the update feed would be broken." >&2
            ls -1 release >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

  # The Omarchy/Linux face: `infinitus-tray` built self-contained
  # (-static-stdlib: Swift runtime linked in, glibc dynamic — runs on
  # Arch without the toolchain) for both architectures, plus the
  # packaging/omarchy dir (Quickshell plugin + Waybar config) as one
  # tarball. Build is container-side; publishing runs on the plain
  # runner because `gh` doesn't exist in the swift image.
  linux:
    name: Build Linux tray
    needs: notes
    runs-on: ${{ matrix.runner }}
    # Both architectures finish in about 4 minutes; without this the job
    # fell to GitHub's 6-hour default and alpha.15 sat 98 minutes on a
    # hung `swift test` (#1333).
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    container: swift:6.1
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
      # A tag build and a nightly report their number (#486); a dispatch dry
      # run stays "dev".
      - env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""
          case "$GITHUB_REF" in
            refs/tags/*) V="$(head -1 ../../VERSION | tr -cd '0-9A-Za-z.-')";;
          esac
          [[ -n "${INPUT_VERSION:-}" ]] && V="$(printf '%s' "$INPUT_VERSION" | tr -cd '0-9A-Za-z.-')"
          if [[ -n "$V" ]]; then
            sed -i "s/static let string = \"dev\"/static let string = \"$V\"/" Sources/InfinitusTray/BuiltVersion.swift
            grep -q "\"$V\"" Sources/InfinitusTray/BuiltVersion.swift
          fi
      - run: swift build -c release -Xswiftc -static-stdlib
      # A per-process guard (#1333): the aarch64 runner once hung at a
      # suite's start with its output buffered, and a cancelled job keeps
      # a truncated log where a failed step keeps the partial one.
      - run: timeout -k 30s 15m swift test
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .build/release/infinitus-tray "dist/infinitus-tray-linux-${{ matrix.arch }}"
          # The static-stdlib binary carries its symbols and debug info
          # otherwise: alpha.1 shipped 107 MB per arch.
          strip "dist/infinitus-tray-linux-${{ matrix.arch }}"
          tar -C packaging -czf dist/infinitus-omarchy.tar.gz omarchy
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: apps/mac/dist/

  # The self-contained CLI archives every runtime installer downloads
  # (#1192): `infinitus-<version>-linux-<arch>.tar.gz` plus the SHA256SUMS
  # `pinnedRuntime` verifies against. Linux only — that is where SSH remote
  # environments run; a Mac or Windows CLI has no archive here and the
  # installers fail with the plain "no archive for this version" 404 rather
  # than reaching for upstream's (`CLI_RELEASE_REPOSITORY`, #1193).
  #
  # Registration point: the build steps below are upstream's `cli_archive`
  # steps from .github/workflows/release-desktop.yml, copied rather than
  # called. That workflow's job downloads a `js-bundle` artifact only
  # upstream's `build_bundle` produces, plus its relay tracing config and
  # four required clerk/relay inputs this fork has no source for, so calling
  # it would mean porting half of upstream's release pipeline. Re-diff these
  # steps against that file on every sync, like the runner swap.
  #
  # Skipped for the nightly (`inputs.version` is set only by
  # infinitus-nightly.yml's workflow_call): a nightly ships no archives, so
  # a nightly desktop's SSH remotes fail cleanly. The dispatch dry run still
  # builds them, so a tag is never the first time these steps run. `publish`
  # needs this job and is tag-only, and a tag sets no inputs, so the skip
  # never strands it.
  cli:
    name: Build CLI archive ${{ matrix.label }}
    if: ${{ !inputs.version }}
    needs: [notes, connect]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(head -1 VERSION | tr -cd '0-9A-Za-z.-')"
          case "$GITHUB_REF" in
            refs/tags/*)
              if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
                echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
                exit 1
              fi;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # Upstream's three filters unchanged: build-cli-archive.ts imports the
      # staging helpers from scripts/build-desktop-artifact.ts, so the
      # desktop package's dependency closure has to be installed even though
      # nothing Electron is built here.
      - name: Install CLI dependencies
        run: vp install --filter=@infinitus/desktop... --filter=t3... --filter=@infinitus/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # The desktop build script builds this for the DMG; a CLI-only job has
      # to do it itself, with the flags that script uses.
      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: >-
          cargo build --locked --release
          --manifest-path native/resource-monitor/Cargo.toml
          --target ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      # Before the single-executable: `build-exe` packs apps/server/dist-exe,
      # but the archive also carries apps/server/dist/client, which t3#build
      # emits. Not `build:desktop` — that adds the Electron main and needs
      # libsecret headers on Linux for a bundle nothing here ships.
      - name: Build server bundle and web client
        env:
          # Fork (#1322): T3 Connect's public values, empty when unset.
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.connect.outputs.clerk_publishable_key }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.connect.outputs.clerk_jwt_template }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.connect.outputs.clerk_cli_oauth_client_id }}
          T3CODE_RELAY_URL: ${{ needs.connect.outputs.relay_url }}
        run: vp run --filter t3 build

      # The single-executable needs a Node with --build-sea (25.7+) while the
      # repo stays on engines.node; vp downloads this exact version. Keep in
      # step with SEA_NODE_VERSION in apps/server/vite.config.ts.
      - name: Build CLI single-executable
        env:
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-${{ matrix.arch }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" \
             "$target_dir/t3-resource-monitor"

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts
          --platform linux
          --arch ${{ matrix.arch }}
          --version "${{ steps.version.outputs.version }}"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Smoke-test CLI archive
        run: >-
          node scripts/smoke-cli-archive.ts --archive release-cli/*
          --expect-version "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error

  # One release for the tag: the DMG, its zip, blockmaps and the
  # `<prerelease id>-mac.yml` manifest electron-updater installs from
  # (#924), the menu bar zip, the Linux binaries. A prerelease while the
  # version carries a prerelease tag (`-alpha.N` or `-beta.N`; electron-updater
  # knows no other id, #924), a full
  # release otherwise, so `releases/latest` is the one-app release once a
  # plain version ships. Notes are that version's section of
  # apps/mac/CHANGELOG.md; a tag without notes cannot ship.
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, desktop, linux, cli]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HAS_DEVID: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        env:
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          # Not `assets/`: the checkout has one (the app artwork) and mkdir must stay loud.
          mkdir release-assets
          cp artifacts/mac-bundles/*.zip release-assets/
          cp artifacts/desktop-mac-arm64/* release-assets/
          cp artifacts/linux-x86_64/infinitus-tray-linux-x86_64 \
             artifacts/linux-aarch64/infinitus-tray-linux-aarch64 \
             artifacts/linux-x86_64/infinitus-omarchy.tar.gz release-assets/
          # The CLI archives every runtime installer downloads (#1192).
          cp artifacts/cli-linux-x64/infinitus-*.tar.gz \
             artifacts/cli-linux-arm64/infinitus-*.tar.gz release-assets/
          # The name before #1368 D, for one window: an install from before the
          # rename asks for `t3-<version>-…` and runs the `t3` symlink inside.
          # Drop together with the symlink in scripts/build-cli-archive.ts.
          for archive in release-assets/infinitus-*.tar.gz; do
            cp "$archive" "release-assets/t3-${archive##*/infinitus-}"
          done
          channel="${VERSION#*-}"
          [[ "$channel" == "$VERSION" ]] && channel=latest || channel="${channel%%.*}"
          for want in "Infinitus-Menu-Bar-${VERSION}.zip" \
                      "Infinitus-${VERSION}-arm64.dmg" "Infinitus-${VERSION}-arm64.zip" "${channel}-mac.yml" \
                      "infinitus-${VERSION}-linux-x64.tar.gz" "infinitus-${VERSION}-linux-arm64.tar.gz" \
                      "t3-${VERSION}-linux-x64.tar.gz" "t3-${VERSION}-linux-arm64.tar.gz"; do
            [[ -f "release-assets/$want" ]] || { echo "Missing release asset $want" >&2; ls -1 release-assets >&2; exit 1; }
          done
          # `pinnedRuntime` verifies a downloaded archive against this file
          # (`CLI_RELEASE_CHECKSUMS_FILE`), and `parseChecksums` keys on the
          # name as written — so hash from inside the directory, with bare
          # names. `shasum -a 256`, not `sha256sum`: this is a macOS runner.
          (
            cd release-assets
            shopt -s nullglob
            archives=(infinitus-*.tar.gz t3-*.tar.gz)
            if [[ ${#archives[@]} -eq 0 ]]; then echo "No CLI archives were produced." >&2; exit 1; fi
            shasum -a 256 "${archives[@]}" > SHA256SUMS
            cat SHA256SUMS
          )
          ls -l release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 == "## " v { grab = 1; next }
            grab && /^## /  { exit }
            grab            { print }
          ' apps/mac/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "apps/mac/CHANGELOG.md has no '## $VERSION' section; a release ships with notes." >&2
            exit 1
          fi
          args=(--title "Infinitus $VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release-assets/*
          echo "Published $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
