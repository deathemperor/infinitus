name: Release
# Tag push (v*) builds the app on the macOS 26 image (the glass chrome
# needs its SDK to compile) and publishes the zip on the release.
on:
  push:
    tags: ["v*"]
  # Dispatch builds the Linux artifacts without a tag (CI dry run);
  # nothing is published from a dispatch.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    # Tag pushes only — a workflow_dispatch dry run must not try to
    # `gh release create` from a branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    env:
      # secrets can't be referenced in `if:` directly; job env is the
      # documented bridge (step-local env is invisible to its own `if`).
      # Only a derived boolean rides job-wide — the raw secret stays
      # step-local to the import step.
      HAS_DEVID: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Developer ID + notarization run only when the secrets exist
      # (docs/RELEASING.md); without them the build is ad-hoc signed as
      # before. Order matters: sign → notarize the app → staple the app →
      # THEN zip, because the staple lives on the .app, not the archive.
      - name: Import Developer ID certificate
        if: env.HAS_DEVID == 'true'
        env:
          DEVID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" \
            -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build app bundle
        run: ./make-app.sh
      - name: Notarize and staple
        if: env.HAS_DEVID == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent Infinitus.app notarize.zip
          xcrun notarytool submit notarize.zip --wait \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple Infinitus.app
          spctl --assess --type execute -vv Infinitus.app
      - name: Zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent Infinitus.app "Infinitus-${VERSION}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Composed notes from CHANGELOG.md (the "## <version>" section);
          # --generate-notes only as the fallback when a tag has no entry.
          awk -v v="$VERSION" '
            $0 == "## " v { grab = 1; next }
            grab && /^## /  { exit }
            grab            { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "Infinitus-${VERSION}.zip" \
              --title "Infinitus $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "Infinitus-${VERSION}.zip" \
              --title "Infinitus $GITHUB_REF_NAME" --generate-notes
          fi
      # Auto-bump the tap cask (CodexBar-style release->tap dispatch, done
      # here with a repo-scoped deploy key instead of a PAT).
      - name: Bump Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "Infinitus-${VERSION}.zip" | cut -d' ' -f1)
          mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:deathemperor/homebrew-tap.git tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/infinitus.rb
          # infinitusctl (agent control CLI, bundled since 0.4) onto PATH —
          # added once, on the first release that ships it; idempotent.
          grep -q '^  binary ' Casks/infinitus.rb || perl -0pi -e \
            's|^  app "Infinitus.app"\n|  app "Infinitus.app"\n  binary "#{appdir}/Infinitus.app/Contents/MacOS/infinitusctl"\n|m' \
            Casks/infinitus.rb
          # `ictl`, the short name for the same binary; same once-only rule.
          grep -q 'MacOS/ictl"' Casks/infinitus.rb || perl -0pi -e \
            's|^(  binary "#\{appdir\}/Infinitus.app/Contents/MacOS/infinitusctl"\n)|$1  binary "#{appdir}/Infinitus.app/Contents/MacOS/ictl"\n|m' \
            Casks/infinitus.rb
          # The caveats follow the build: a Developer ID + notarized
          # release needs no Gatekeeper workaround, an ad-hoc one (no
          # signing secrets) keeps it. Rewritten whole every release so
          # the cask can't drift — 0.4.3 and 0.4.4-alpha.1 shipped
          # notarized while the cask still said "ad-hoc, not notarized".
          if [ "$HAS_DEVID" = "true" ]; then
            GATE=""
          else
            GATE=$'Builds are ad-hoc signed, not notarized. If Gatekeeper refuses the\nfirst launch:\n  xattr -dr com.apple.quarantine "/Applications/Infinitus.app"\nor install with --no-quarantine.\n\n'
          fi
          CAVEATS="${GATE}The app drives the swapd engine:"$'\n'"  cargo install --git https://github.com/deathemperor/swapd swapd" \
            perl -0pi -e 's|^  caveats <<~EOS\n.*?^  EOS\n|"  caveats <<~EOS\n" . join("", map { $_ eq "" ? "\n" : "    $_\n" } split(/\n/, $ENV{CAVEATS})) . "  EOS\n"|mse' \
            Casks/infinitus.rb
          git -c user.name="infinitus-release" \
              -c user.email="actions@github.com" \
              commit -am "infinitus ${VERSION}"
          git push

  # The Omarchy/Linux face: `infinitus-tray` built self-contained
  # (-static-stdlib: Swift runtime linked in, glibc dynamic — runs on
  # Arch without the toolchain) for both architectures, plus the
  # packaging/omarchy dir (Quickshell plugin + Waybar config) as one
  # tarball. Build is container-side; publishing runs on the plain
  # runner because `gh` doesn't exist in the swift image.
  linux-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # A tag build reports its number (#486); a dispatch dry run stays "dev".
      - run: |
          case "$GITHUB_REF_NAME" in
            v*) V="$(printf '%s' "${GITHUB_REF_NAME#v}" | tr -cd '0-9A-Za-z.-')"
                sed -i "s/static let string = \"dev\"/static let string = \"$V\"/" Sources/InfinitusTray/BuiltVersion.swift
                grep -q "\"$V\"" Sources/InfinitusTray/BuiltVersion.swift;;
          esac
      - run: swift build -c release -Xswiftc -static-stdlib
      - run: swift test
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .build/release/infinitus-tray "dist/infinitus-tray-linux-${{ matrix.arch }}"
          tar -C packaging -czf dist/infinitus-omarchy.tar.gz omarchy
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
  linux-publish:
    needs: [release, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/linux-x86_64/infinitus-tray-linux-x86_64 \
            dist/linux-aarch64/infinitus-tray-linux-aarch64 \
            dist/linux-x86_64/infinitus-omarchy.tar.gz \
            --clobber
