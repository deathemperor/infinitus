name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Everything except `t3` (apps/server). `--parallel` drops the package
  # dependency ordering that `vp run` applies by default: these `test` tasks
  # declare no `dependsOn` and resolve workspace deps from source, so ordering
  # only bought us idle runners between dependency layers. The concurrency
  # limit stays at the default 4 so peak load per runner is unchanged.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server sets `fileParallelism: false`, so its 239 files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # The static analysis below needs a macOS runner, which bills ~6.7x a Linux
  # minute, so gate it on the native sources it actually lints instead of paying
  # for it on every push. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  # ---------------------------------------------------------------- apps/mac
  # The native Swift app (menu bar, infinitusctl, the Linux tray) lives in
  # apps/mac since #823 (layer 2). Its jobs are path-filtered: the job
  # always runs and reports (so mac-test, mac-e2e and mac-linux can be
  # required checks on main), but every step is skipped unless something
  # under apps/mac/ or this workflow changed. macOS minutes bill ~6.7x a
  # Linux minute, so a server-only PR pays nothing here.
  mac_changes:
    name: Mac Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect Mac app changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running the Mac jobs."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          pattern='^apps/mac/|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Mac app sources changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Mac app sources changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The unit tests run as two halves on two runners: the Team suites
  # drive real git (a publish is dozens of subprocesses) and took 17 of
  # the old single job's 20 minutes (2026-09-07). Both halves run test
  # classes in parallel. `mac-test` is the one check the ruleset requires;
  # it just needs both halves green.
  mac-test-core:
    name: mac-test-core
    needs: mac_changes
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
        if: needs.mac_changes.outputs.changed != 'false'
      - uses: actions/cache@v4
        with:
          path: apps/mac/.build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-
            spm-mac-${{ runner.os }}-
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift build
        if: needs.mac_changes.outputs.changed != 'false'
      - name: generated files are current
        run: tools/t3ref/check-generated.sh
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift test --parallel --skip Team
        if: needs.mac_changes.outputs.changed != 'false'
  mac-test-team:
    name: mac-test-team
    needs: mac_changes
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
        if: needs.mac_changes.outputs.changed != 'false'
      - uses: actions/cache@v4
        with:
          path: apps/mac/.build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-
            spm-mac-${{ runner.os }}-
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift build
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift test --parallel --filter Team
        if: needs.mac_changes.outputs.changed != 'false'
  mac-test:
    name: mac-test
    runs-on: ubuntu-24.04
    needs: [mac-test-core, mac-test-team]
    if: always()
    steps:
      - run: |
          test "${{ needs.mac-test-core.result }}" = success && test "${{ needs.mac-test-team.result }}" = success
  # End-to-end + performance gate (#18): the debug app against the demo
  # engine, driven through infinitusctl; fails on a broken command, a
  # missing pop-out, or idle CPU / RSS over budget (apps/mac/tools/e2e.sh).
  mac-e2e:
    name: mac-e2e
    needs: mac_changes
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
        if: needs.mac_changes.outputs.changed != 'false'
      - uses: actions/cache@v4
        with:
          path: apps/mac/.build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-mac-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved', 'apps/mac/Package.swift') }}-
            spm-mac-${{ runner.os }}-
        if: needs.mac_changes.outputs.changed != 'false'
      # Plain `swift build`: with two --product flags SwiftPM builds only
      # the LAST one, so the app binary here was the stale one from the
      # first cached .build on every run (2026-09-03).
      - run: swift build
        if: needs.mac_changes.outputs.changed != 'false'
      - run: tools/e2e.sh
        if: needs.mac_changes.outputs.changed != 'false'
  # The Omarchy/Waybar face (apps/mac/packaging/omarchy): core + tray must
  # keep building on Linux. The manifest gates the AppKit target off
  # non-macOS hosts.
  mac-linux:
    name: mac-linux
    needs: mac_changes
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift build
        if: needs.mac_changes.outputs.changed != 'false'
      - run: swift test
        if: needs.mac_changes.outputs.changed != 'false'
  # Known red today: CZlib's module map includes <zlib.h>, which no
  # Windows toolchain provides, so InfinitusCore does not build there
  # (apps/mac/docs/superpowers/specs/2026-09-05-team-design.md §9). The
  # job runs to show when that changes; failures don't block a merge.
  mac-windows:
    name: mac-windows
    needs: mac_changes
    runs-on: windows-2022
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v6
        if: needs.mac_changes.outputs.changed != 'false'
      - uses: compnerd/gha-setup-swift@v0.4.1
        if: needs.mac_changes.outputs.changed != 'false'
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - run: vcpkg install zlib:x64-windows
        if: needs.mac_changes.outputs.changed != 'false'
      - run: >
          swift build --product infinitusctl
          -Xcc -IC:/vcpkg/installed/x64-windows/include
          -Xswiftc -LC:/vcpkg/installed/x64-windows/lib
        if: needs.mac_changes.outputs.changed != 'false'
