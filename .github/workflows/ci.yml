name: CI
# Build + test on every push/PR. Pattern borrowed from steipete/CodexBar's
# ci.yml (concurrency-cancel + SwiftPM cache keyed on Package.resolved),
# sized down for a single-platform menu bar app.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The unit tests run as two halves on two runners: the Team suites
  # drive real git (a publish is dozens of subprocesses) and took 17 of
  # the old single job's 20 minutes (2026-09-07). Both halves run test
  # classes in parallel. `test` below is the one check the main ruleset
  # requires; it just needs both halves green, so open PRs and the
  # ruleset stayed as they were.
  test-core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      - run: swift build
      - run: swift test --parallel --skip Team
  test-team:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      - run: swift build
      - run: swift test --parallel --filter Team
  test:
    runs-on: ubuntu-latest
    needs: [test-core, test-team]
    if: always()
    steps:
      - run: |
          test "${{ needs.test-core.result }}" = success && test "${{ needs.test-team.result }}" = success
  # End-to-end + performance gate (#18): the debug app against the demo
  # engine, driven through infinitusctl; fails on a broken command, a
  # missing pop-out, or idle CPU / RSS over budget (tools/e2e.sh).
  e2e:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      # Plain `swift build`: with two --product flags SwiftPM builds only
      # the LAST one, so the app binary here was the stale one from the
      # first cached .build on every run (2026-09-03).
      - run: swift build
      - run: tools/e2e.sh
  # The Omarchy/Waybar face (packaging/omarchy): core + tray must keep
  # building on Linux. Same plain invocations — the manifest gates the
  # AppKit target off non-macOS hosts.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  # The phone app shares InfinitusCore, so a change green on the Mac can
  # still lean on an API iOS lacks (Foundation.Process in TeamGit, #60).
  # Simulator build, then the phone's unit tests (InfinitusMobileTests)
  # on one simulator; no signing, no device.
  ios:
    runs-on: macos-26
    # A wedged simulator must not hold main's merges (ios is required).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: xcodegen generate
        working-directory: ios
      - run: >
          xcodebuild -quiet -project InfinitusMobile.xcodeproj -scheme InfinitusMobile
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.build/ios
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      # Whatever iPhone simulator this Xcode ships, by id — device names
      # change with every runner image.
      - run: >
          echo "SIM_ID=$(xcrun simctl list devices available -j
          | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')" >> "$GITHUB_ENV"
      - run: >
          xcodebuild -quiet -project InfinitusMobile.xcodeproj -scheme InfinitusMobile
          -destination "id=$SIM_ID" -derivedDataPath ../.build/ios
          CODE_SIGNING_ALLOWED=NO test
        working-directory: ios
  # Known red today: CZlib's module map includes <zlib.h>, which no
  # Windows toolchain provides, so InfinitusCore does not build there
  # (docs/superpowers/specs/2026-09-05-team-design.md §9). The job runs
  # to show when that changes; failures don't block a merge.
  windows:
    # windows-latest moved to Visual Studio 18, whose STL refuses the
    # swift-6.1 toolchain's clang (STL1000 "expected Clang 20 or newer",
    # #155) before any of our code compiles; 2022 still carries VS 17.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      # zlib for CZlib: the toolchain has no <zlib.h>; vcpkg on the
      # runner image does (#171, second wall after the Glibc imports).
      # The paths are spelled out because pwsh splits a `-I${env:…}`
      # token before swift sees it ("The command parameter was already
      # specified"), and they ride the command line rather than the
      # MSVC INCLUDE/LIB variables: once LIB is set, clang stops adding
      # the VC and SDK lib dirs of its own (msvcrt.lib went missing).
      # vcpkg names the import library z.lib, which the modulemap's
      # `link "z"` asks for.
      - run: vcpkg install zlib:x64-windows
      - run: >
          swift build --product infinitusctl
          -Xcc -IC:/vcpkg/installed/x64-windows/include
          -Xswiftc -LC:/vcpkg/installed/x64-windows/lib
