name: CI
# Build + test on every push/PR. Pattern borrowed from steipete/CodexBar's
# ci.yml (concurrency-cancel + SwiftPM cache keyed on Package.resolved),
# sized down for a single-platform menu bar app.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      - run: swift build
      - run: swift test
  # End-to-end + performance gate (#18): the debug app against the demo
  # engine, driven through infinitusctl; fails on a broken command, a
  # missing pop-out, or idle CPU / RSS over budget (tools/e2e.sh).
  e2e:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          # Per-commit key: actions/cache never overwrites an existing key,
          # so a key on the manifest hash alone froze .build at its first
          # save and every later run rebuilt from that (2026-09-03).
          key: spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ github.repository }}-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            spm-${{ github.repository }}-${{ runner.os }}-
      # Plain `swift build`: with two --product flags SwiftPM builds only
      # the LAST one, so the app binary here was the stale one from the
      # first cached .build on every run (2026-09-03).
      - run: swift build
      - run: tools/e2e.sh
  # The Omarchy/Waybar face (packaging/omarchy): core + tray must keep
  # building on Linux. Same plain invocations — the manifest gates the
  # AppKit target off non-macOS hosts.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
  # The phone app shares InfinitusCore, so a change green on the Mac can
  # still lean on an API iOS lacks (Foundation.Process in TeamGit, #60).
  # Simulator build only: no signing, no device, no test run.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: xcodegen generate
        working-directory: ios
      - run: >
          xcodebuild -quiet -project InfinitusMobile.xcodeproj -scheme InfinitusMobile
          -destination 'generic/platform=iOS Simulator' -derivedDataPath ../.build/ios
          CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
  # Known red today: CZlib's module map includes <zlib.h>, which no
  # Windows toolchain provides, so InfinitusCore does not build there
  # (docs/superpowers/specs/2026-09-05-team-design.md §9). The job runs
  # to show when that changes; failures don't block a merge.
  windows:
    # windows-latest moved to Visual Studio 18, whose STL refuses the
    # swift-6.1 toolchain's clang (STL1000 "expected Clang 20 or newer",
    # #155) before any of our code compiles; 2022 still carries VS 17.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - run: swift build --product infinitusctl
