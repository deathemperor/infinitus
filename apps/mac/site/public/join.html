<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join a team — Infinitus</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 -apple-system, system-ui, sans-serif; background: #0d0f14; color: #e6e8ee; padding: 24px; box-sizing: border-box; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; color: #aab0bf; }
  code { display: block; margin: 1rem 0; padding: .75rem; border-radius: .5rem; background: #171a22; color: #e6e8ee; font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; user-select: all; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid #3a3f4d; background: #1c202a; color: #e6e8ee; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Infinitus…</h1>
  <p id="note">Hold on while this link hands the invite to the app.</p>
  <code id="code" hidden></code>
  <button id="copy" hidden type="button">Copy code</button>
</main>
<script>
// A team invite (#1313): https://infinitus.run/join#<code>. The code is a
// secret and rides in the fragment, which never reaches this server. On a
// phone with Infinitus installed the universal link never gets here — the
// app takes it. A desktop browser is forwarded to the desktop app's own
// infinitus://join/<code>; if nothing opens, the code is shown to paste
// into Settings › Infinitus › Team. Nothing joins on its own.
(function () {
  var code = location.hash.replace(/^#/, "");
  var title = document.getElementById("title");
  var note = document.getElementById("note");
  var codeEl = document.getElementById("code");
  var copy = document.getElementById("copy");
  var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  function reveal() {
    title.textContent = "Your team invite";
    note.textContent = "If Infinitus did not open, paste this code into Settings › Infinitus › Team.";
    codeEl.textContent = decodeURIComponent(code);
    codeEl.hidden = false;
    copy.hidden = false;
    copy.onclick = function () {
      navigator.clipboard.writeText(decodeURIComponent(code)).then(function () {
        copy.textContent = "Copied";
      }, function () {
        copy.textContent = "Select the code and copy it";
      });
    };
  }
  if (!code) {
    title.textContent = "This invite link is incomplete";
    note.textContent = "Ask the person who invited you for the full link, or paste the code they gave you into Settings › Infinitus › Team.";
    return;
  }
  if (phone) {
    title.textContent = "Open this in the Infinitus app";
    note.textContent = "Team invites open in the Infinitus phone app. Install it, then open this link again.";
    return;
  }
  location.replace("infinitus://join/" + code);
  setTimeout(reveal, 1500);
})();
</script>
</body>
</html>
