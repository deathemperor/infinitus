<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 640 432">
  <!--
    The Infinitus installer. Rasterized by sips (CoreSVG) at build time, so only
    gradients, plain shapes and text: no filters, masks or CSS. Finder draws the
    icon labels black, hence the light base. Palette and mark geometry come from
    apps/mac/make-icon.swift and MenuBarGlyph.swift (cobalt #2647D9, midnight
    #0A0F26, ion cyan #80E8FF; twin loop of r 3.2 rings 5 apart, the right one
    broken from -70° to -10° for the swap arrow). Icons land at (166,214) and
    (474,214), 120px, labels below them; the bottom 32px stay empty.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F4F7FD"/>
      <stop offset="1" stop-color="#E3E9F6"/>
    </linearGradient>
    <radialGradient id="ion" cx="320" cy="232" r="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80E8FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#80E8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="squircle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2647D9"/>
      <stop offset="1" stop-color="#0A0F26"/>
    </linearGradient>
    <radialGradient id="ionSmall" cx="44" cy="35" r="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80E8FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#80E8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="432" fill="url(#base)"/>
  <rect width="640" height="432" fill="url(#ion)"/>

  <!-- The twin loop as a watermark, one ring around each drop target so the
       icons sit inside the mark. Unbroken: the drag arrow below carries the
       swap arrow, and two arrows would compete. -->
  <g fill="none" stroke="#2647D9" stroke-opacity=".055" stroke-width="30">
    <circle cx="166" cy="214" r="197"/>
    <circle cx="474" cy="214" r="197"/>
  </g>

  <!-- The app icon in miniature: the squircle, its glow and the twin loop. -->
  <rect x="26" y="17" width="36" height="36" rx="10" fill="url(#squircle)"/>
  <rect x="26" y="17" width="36" height="36" rx="10" fill="url(#ionSmall)"/>
  <g transform="translate(40 35) scale(1.6)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <circle cx="0" cy="0" r="3.2"/>
    <path d="M8.151 -0.556A3.2 3.2 0 1 1 6.094 -3.007"/>
    <path d="M8.256 -2.225L6.675 -4.605L5.513 -1.409Z" fill="#FFFFFF" stroke="none"/>
  </g>
  <text x="72" y="40" fill="#0A0F26" font-family="Helvetica" font-size="13" font-weight="700">Infinitus</text>

  <text x="320" y="104" fill="#0A0F26" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag Infinitus into Applications.</text>

  <!-- The swap arrow, the way the mark draws it: a ring segment with a filled
       head riding its end, clockwise, from the app over the top to Applications.
       Arc centre (320,262) r 80, from -150° to -30°. -->
  <path d="M250.72 222A80 80 0 0 1 389.28 222" stroke="#2647D9" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M396.78 234.99L397.07 217.50L381.49 226.50Z" fill="#2647D9"/>

  <text x="320" y="367" fill="#4A5578" font-family="Helvetica" font-size="12" font-weight="400" text-anchor="middle">Once copied, open it from Applications.</text>
</svg>
